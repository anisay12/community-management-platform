[project]
name = "talan-communities"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4",
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "django-prometheus>=2.3",
    "django-storages[s3]>=1.14",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "structlog>=24",
]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = [".internal", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/config/settings/*" = ["F403", "F405"]
"src/config/settings/test.py" = ["F403", "F405", "S105"]
"**/tests/**" = ["S101", "S105", "S106", "S310", "S603"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
addopts = "--strict-markers -ra"
markers = ["integration: nécessite un service externe (stockage S3-compatible)"]

[tool.coverage.run]
source = ["src"]
# dev.py et prod.py sont chargés dans des sous-processus par config/tests/test_settings.py.
omit = [
    "*/migrations/*",
    "*/tests/*",
    "src/config/wsgi.py",
    "src/config/settings/dev.py",
    "src/config/settings/prod.py",
]
