map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

upstream django {
    server web:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Metrics are only scraped on the internal network, directly on web:8000.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_read_timeout 60s;
    }

    # Private documents (ADR-0001). Only reachable through the X-Accel-Redirect answered by
    # Django after its permission check: `internal` makes any request from outside a 404.
    # Django appends the path and query of a short-lived presigned storage URL to the prefix
    # (/_protected/<bucket>/<key>?X-Amz-...); Nginx relays them to the storage endpoint that
    # URL was signed for. ${STORAGE_ORIGIN} (for example http://s3:8333, the value of
    # S3_ENDPOINT_URL) is substituted when the container starts: this file is mounted as
    # /etc/nginx/templates/default.conf.template (see docs/development.md).
    #
    # On an X-Accel-Redirect, Nginx keeps only Content-Type, Content-Disposition,
    # Cache-Control, Expires, Set-Cookie and Accept-Ranges from Django's response; the same
    # headers coming from the storage are hidden below so that Django's values win, and the
    # security headers Nginx would otherwise drop are added here.
    location /_protected/ {
        internal;
        proxy_pass ${STORAGE_ORIGIN}/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        # Never forward the browser's cookies, Authorization or body to the storage: only the
        # Host the URL was signed for and the range headers (resumed downloads, PDF viewers).
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        # The storage cannot redirect, set cookies or caching rules for the platform.
        proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset Expires Cache-Control Set-Cookie Vary;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-version-id;
        proxy_hide_header x-amz-server-side-encryption;
        proxy_hide_header x-ms-request-id;
        # A storage error (expired signature, missing object, outage) becomes a bare Nginx
        # error: the storage's XML body would describe the signed request.
        proxy_intercept_errors on;
        error_page 400 401 403 404 405 = @protected_missing;
        error_page 500 501 502 503 504 = @protected_unavailable;
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Django's Content-Disposition and Cache-Control (private, no-store) stay on these
    # errors: without the headers-more module Nginx cannot drop them.
    location @protected_missing {
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }

    location @protected_unavailable {
        add_header X-Content-Type-Options "nosniff" always;
        return 502;
    }
}
