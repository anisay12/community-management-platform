{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Edit my profile" %} - {% translate "Communities" %}{% endblock %}
{% block content %}
  <h1>{% translate "Edit my profile" %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "manage/_fields.html" %}
    <div class="actions">
      <button type="submit">{% translate "Save" %}</button>
      <a href="{% url 'accounts:profile_me' %}">{% translate "Cancel" %}</a>
    </div>
  </form>
{% endblock %}
