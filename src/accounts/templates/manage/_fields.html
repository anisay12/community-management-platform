{% for field in form %}
  <div class="field{% if field.errors %} field-has-error{% endif %}">
    {% if field.use_fieldset %}
      <fieldset>
        <legend>{{ field.label }}</legend>
        {{ field }}
      </fieldset>
    {% else %}
      {{ field.label_tag }}
      {{ field }}
    {% endif %}
    {% if field.help_text %}<small class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
  </div>
{% endfor %}
