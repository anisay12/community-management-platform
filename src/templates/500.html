<!doctype html>
<html lang="@@LANG@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>@@TITLE@@ - @@SITE@@</title>
<style>
/* Self-contained on purpose: no template engine, no database, no static files.
   Token values are copied from core/static/core/scss/tokens.scss. */
:root {
  --tl-color-primary: #0b5cad;
  --tl-color-bg: #ffffff;
  --tl-color-surface: #f5f7fa;
  --tl-color-text: #1a1a1a;
  --tl-color-text-muted: #555b66;
  --tl-color-border: #858c97;
  --tl-color-focus: #b45309;
  --tl-font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tl-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --tl-radius: 0.375rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --tl-color-primary: #7db8f2;
    --tl-color-bg: #10151c;
    --tl-color-surface: #1a212b;
    --tl-color-text: #eef1f5;
    --tl-color-text-muted: #a9b2bf;
    --tl-color-border: #7a8594;
    --tl-color-focus: #ffb454;
  }
}
body { font-family: var(--tl-font-sans); line-height: 1.5; margin: 0; padding: 3rem 1rem; color: var(--tl-color-text); background: var(--tl-color-bg); }
main { max-width: 36rem; margin: 0 auto; padding: 1.5rem; background: var(--tl-color-surface); border: 1px solid var(--tl-color-border); border-radius: var(--tl-radius); }
h1 { font-size: 1.75rem; margin: 0 0 1rem; }
p { margin: 0 0 1rem; }
code { font-family: var(--tl-font-mono); background: var(--tl-color-bg); padding: 0.1rem 0.3rem; border-radius: var(--tl-radius); }
a { color: var(--tl-color-primary); }
a:focus-visible { outline: 3px solid var(--tl-color-focus); outline-offset: 2px; }
</style>
</head>
<body>
<main id="main">
<h1>@@TITLE@@</h1>
<p>@@MESSAGE@@</p>
@@REFERENCE@@
</main>
</body>
</html>
